name: inbox_rs_mobile
description: Dead-simple inbox capture for Inbox RS. Open, drop in a note/audio/photo/video, send.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  image_picker: ^1.1.0
  record: ^6.0.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.1.0
  flutter_web_auth_2: ^4.0.0
  uuid: ^4.5.0
  path: ^1.9.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
