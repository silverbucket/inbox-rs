name: Deploy to Staging

# Secondary publishing method: builds an arbitrary branch and deploys just the
# web app's dist/ to the staging 5apps site (inbox-staging.5apps.com).
#
# Unlike release.yml this does NOT bump versions, tag, push to origin, or cut a
# GitHub Release — it only builds the selected branch and ships the built
# artifacts to the staging remote. Nothing about origin/master is touched.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy to staging
        required: true
        type: string
        default: master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # Full history is required — `git subtree split` walks the whole
          # commit graph, so a shallow clone (checkout's default fetch-depth: 1)
          # would break the deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Restore transcription asset cache
        uses: actions/cache@v4
        with:
          path: packages/web/public/ml
          key: ${{ runner.os }}-transcription-assets-${{ hashFiles('scripts/vendor-transcription-assets.mjs', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-transcription-assets-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build web app
        # STAGING_BUILD=1 turns on sourcemaps + the __STAGING__ flag (labels the
        # build "Staging" in the UI instead of a version number)
        # (see packages/web/vite.config.ts).
        env:
          STAGING_BUILD: '1'
        run: npm run build

      - name: Setup SSH for 5apps
        env:
          FIVEAPPS_DEPLOY_KEY: ${{ secrets.FIVEAPPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$FIVEAPPS_DEPLOY_KEY" > ~/.ssh/5apps_key
          chmod 600 ~/.ssh/5apps_key
          # 5apps' SSH server intermittently closes connections or stalls past
          # ssh-keyscan's default 5s timeout; one empty scan has already sunk a
          # release. Retry, and require at least one key before continuing.
          for attempt in {1..5}; do
            ssh-keyscan -T 15 -H 5apps.com > ~/.ssh/5apps_hosts 2>/dev/null || true
            if [ -s ~/.ssh/5apps_hosts ]; then
              cat ~/.ssh/5apps_hosts >> ~/.ssh/known_hosts
              break
            fi
            echo "ssh-keyscan 5apps.com returned no keys (attempt $attempt/5), retrying..."
            sleep $((attempt * 5))
          done
          if ! [ -s ~/.ssh/5apps_hosts ]; then
            echo "::error::Could not fetch 5apps.com host keys after 5 attempts."
            exit 1
          fi
          echo -e "Host 5apps.com\n  IdentityFile ~/.ssh/5apps_key" >> ~/.ssh/config

      - name: Deploy to 5apps staging
        # Force-add build artifacts onto a throwaway deploy branch, extract just
        # the dist/ subtree, and push that to the staging remote. The deploy
        # commit is never pushed to origin.
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git remote add 5apps-staging git@5apps.com:silverbucket_inbox-rs-staging.git 2>/dev/null \
            || git remote set-url 5apps-staging git@5apps.com:silverbucket_inbox-rs-staging.git

          # Content-hashed runtime assets are immutable and may still be used
          # by a dormant installed PWA. Carry the deployed set forward; only
          # mutable shell files are replaced by the new release.
          git fetch 5apps-staging +refs/heads/master:refs/remotes/5apps-staging/master
          node scripts/retain-deployed-web-assets.mjs 5apps-staging/master
          node scripts/create-deployed-entry-shims.mjs 5apps-staging/master
          node scripts/check-web-deploy.mjs

          # Throwaway branch for the deploy commit so nothing local is pushed to origin.
          git checkout -b "staging-deploy/${{ github.run_id }}"
          git add packages/web/dist -f
          git commit -m "deploy ${BRANCH} to staging [skip ci]"

          SPLIT_SHA=$(git subtree split --prefix=packages/web/dist)
          # 5apps.com has been seen dropping the SSH session mid-push, so the
          # push is retried. The build above carried forward assets from the
          # 5apps-staging/master we fetched, so that fetched SHA is the only remote
          # state this deploy may replace: a lease on it means neither the
          # first attempt nor a retry can clobber a deploy that landed in
          # between. A retry that finds the ref already at SPLIT_SHA means an
          # earlier attempt actually got through and is treated as success.
          EXPECTED_SHA=$(git rev-parse refs/remotes/5apps-staging/master)
          for attempt in {1..5}; do
            if git push 5apps-staging "$SPLIT_SHA":refs/heads/master \
                --force-with-lease=refs/heads/master:"$EXPECTED_SHA"; then
              break
            fi
            REMOTE_SHA=$(git ls-remote 5apps-staging refs/heads/master 2>/dev/null | cut -f1 || true)
            if [ "$REMOTE_SHA" = "$SPLIT_SHA" ]; then
              echo "5apps-staging/master is already at $SPLIT_SHA from an earlier attempt."
              break
            fi
            if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::5apps-staging/master moved to $REMOTE_SHA (expected $EXPECTED_SHA) while this deploy was running. Refusing to overwrite it; re-dispatch to deploy on top of it."
              exit 1
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Push to 5apps-staging failed after 5 attempts."
              exit 1
            fi
            echo "Push to 5apps-staging failed (attempt $attempt/5), retrying..."
            sleep $((attempt * 10))
          done
