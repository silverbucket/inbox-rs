name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Refuse to release unless CI (build + unit + e2e PWA) is green for the
  # commit being released. Release is workflow_dispatch (manual), so the
  # cross-workflow gate has to be an explicit lookup against the GitHub
  # API rather than `needs:`.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          STATUS=$(gh run list \
            --workflow=ci.yml \
            --branch=master \
            --commit "$SHA" \
            --json status,conclusion \
            --jq '[.[] | select(.status=="completed")] | .[0].conclusion' \
            || echo "")
          echo "ci.yml conclusion for $SHA: ${STATUS:-<none>}"
          if [ "$STATUS" != "success" ]; then
            echo "::error::Refusing to release: ci.yml has not passed for $SHA. Re-run CI on master and try again."
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        # `npm version` updates the root package.json. Per-package + manifest
        # bumps are delegated to scripts/release-bump.mjs, which only bumps
        # the browser extensions when their effective bundle (their own
        # package directory + rs-module) changed since the previous tag.
        # This avoids burning store-version numbers on web-only releases.
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump per-package versions (conditional on what changed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-bump.mjs "$VERSION"

      - name: Commit version bump and tag
        # This clean commit (no build artifacts) is what gets pushed to origin/master.
        # `git add -u` picks up exactly what release-bump.mjs touched — which
        # may or may not include the extension manifests depending on what
        # changed since the previous tag.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add -u
          git commit -m "release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master --tags

      - name: Build web app
        run: npm run build

      - name: Setup SSH for 5apps
        env:
          FIVEAPPS_DEPLOY_KEY: ${{ secrets.FIVEAPPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$FIVEAPPS_DEPLOY_KEY" > ~/.ssh/5apps_key
          chmod 600 ~/.ssh/5apps_key
          ssh-keyscan -H 5apps.com >> ~/.ssh/known_hosts
          echo -e "Host 5apps.com\n  IdentityFile ~/.ssh/5apps_key" >> ~/.ssh/config

      - name: Deploy to 5apps
        # Force-add build artifacts onto a throwaway deploy branch, extract just
        # the dist/ subtree, and push that to 5apps. The deploy commit is never
        # pushed to origin — only the clean version-bump commit above reaches master.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git remote add 5apps git@5apps.com:silverbucket_inbox-rs.git 2>/dev/null \
            || git remote set-url 5apps git@5apps.com:silverbucket_inbox-rs.git

          # Create a throwaway branch for the deploy commit so master stays clean.
          git checkout -b deploy/v${VERSION}
          git add packages/web/dist -f
          git commit -m "deploy v${VERSION} [skip ci]"

          SPLIT_SHA=$(git subtree split --prefix=packages/web/dist)
          git push 5apps "$SPLIT_SHA":refs/heads/master --force

          # Return to master; the deploy branch is local-only and discarded.
          git checkout master

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
