name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Refuse to release unless CI (build + unit + e2e PWA) is green for the
  # commit being released. Release is workflow_dispatch (manual), so the
  # cross-workflow gate has to be an explicit lookup against the GitHub
  # API rather than `needs:`.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in {1..60}; do
            RUN=$(gh run list \
              --workflow="CI" \
              --branch=master \
              --commit "$SHA" \
              --json status,conclusion,headSha,url \
              --jq '[.[] | select(.headSha=="'"$SHA"'")] | first // {status:"",conclusion:"",url:""}' \
              || jq -n '{status:"",conclusion:"",url:""}')

            STATUS=$(jq -r '.status // ""' <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN")
            URL=$(jq -r '.url // ""' <<< "$RUN")

            echo "CI status for $SHA: ${STATUS:-<none>} ${CONCLUSION:-}"

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "completed" ]; then
              echo "::error::CI completed for $SHA but did not succeed (conclusion: $CONCLUSION). $URL"
              exit 1
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for CI to complete for $SHA on master."
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      version: ${{ steps.version.outputs.version }}
      extension_bumped: ${{ steps.bump.outputs.extension_bumped }}
      thunderbird_bumped: ${{ steps.bump.outputs.thunderbird_bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Restore transcription asset cache
        uses: actions/cache@v4
        with:
          path: packages/web/public/ml
          key: ${{ runner.os }}-transcription-assets-${{ hashFiles('scripts/vendor-transcription-assets.mjs', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-transcription-assets-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        # `npm version` updates the root package.json. Per-package + manifest
        # bumps are delegated to scripts/release-bump.mjs, which only bumps
        # the browser extensions when a path under their own package
        # directory, rs-module, or the lockfile changed since the previous
        # tag. This avoids burning store-version numbers on web-only releases.
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump per-package versions (conditional on what changed)
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-bump.mjs "$VERSION"

      - name: Build web app
        run: npm run build

      - name: Package reviewer sources for the release versions
        run: npm run package:submissions

      - name: Verify release artifacts before publishing
        run: npm run check:submissions

      - uses: actions/upload-artifact@v4
        with:
          name: extension-submissions-${{ steps.version.outputs.version }}
          path: dist/submissions
          retention-days: 90
          if-no-files-found: error

      - name: Commit version bump and tag
        # This clean commit (no build artifacts) is what gets pushed to origin/master.
        # `git add -u` picks up exactly what release-bump.mjs touched — which
        # may or may not include the extension manifests depending on what
        # changed since the previous tag.
        #
        # Skipped when the tag already exists: a re-run of this job replays the
        # bump from the dispatched commit and arrives at the same version, so
        # without this guard `git tag` aborts the whole job (exit 128) and the
        # steps after it never get their retry.
        #
        # But an existing tag name is not on its own proof that a prior attempt
        # landed this release — it could be a hand-made tag, or one left behind
        # by a partial push. Resuming on that would deploy this checkout while
        # the release notes are cut from an unrelated commit, so the tag has to
        # look like this release (same version in its package.json) and already
        # be on master. Anything else stops the run rather than guessing.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            # origin is the source of truth for both refs; a local tag from the
            # checkout may be stale.
            git fetch -q origin "+refs/heads/master:refs/remotes/origin/master" "+refs/tags/${TAG}:refs/tags/${TAG}"
            TAGGED_VERSION=$(git show "${TAG}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)

            if [ "$TAGGED_VERSION" = "$VERSION" ] && git merge-base --is-ancestor "${TAG}" origin/master; then
              echo "::notice::${TAG} is already committed, tagged and on master from an earlier attempt — skipping the bump commit."
              exit 0
            fi

            echo "::error::${TAG} already exists but is not this release on master (tagged version: ${TAGGED_VERSION:-unknown}). Refusing to deploy a checkout that does not match the tag. Delete or correct the tag, or dispatch a different bump."
            exit 1
          fi

          git add -u
          git commit -m "release v${VERSION}"
          git tag "${TAG}"
          # --atomic so the tag can never land without the master commit; that
          # split is what leaves a re-run facing a tag it can't safely resume.
          git push --atomic origin HEAD:master --tags

      - name: Setup SSH for 5apps
        env:
          FIVEAPPS_DEPLOY_KEY: ${{ secrets.FIVEAPPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$FIVEAPPS_DEPLOY_KEY" > ~/.ssh/5apps_key
          chmod 600 ~/.ssh/5apps_key
          # 5apps' SSH server intermittently closes connections or stalls past
          # ssh-keyscan's default 5s timeout; one empty scan has already sunk a
          # release. Retry, and require at least one key before continuing.
          for attempt in {1..5}; do
            ssh-keyscan -T 15 -H 5apps.com > ~/.ssh/5apps_hosts 2>/dev/null || true
            if [ -s ~/.ssh/5apps_hosts ]; then
              cat ~/.ssh/5apps_hosts >> ~/.ssh/known_hosts
              break
            fi
            echo "ssh-keyscan 5apps.com returned no keys (attempt $attempt/5), retrying..."
            sleep $((attempt * 5))
          done
          if ! [ -s ~/.ssh/5apps_hosts ]; then
            echo "::error::Could not fetch 5apps.com host keys after 5 attempts."
            exit 1
          fi
          echo -e "Host 5apps.com\n  IdentityFile ~/.ssh/5apps_key" >> ~/.ssh/config

      - name: Deploy to 5apps
        # Force-add build artifacts onto a throwaway deploy branch, extract just
        # the dist/ subtree, and push that to 5apps. The deploy commit is never
        # pushed to origin — only the clean version-bump commit above reaches master.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git remote add 5apps git@5apps.com:silverbucket_inbox-rs.git 2>/dev/null \
            || git remote set-url 5apps git@5apps.com:silverbucket_inbox-rs.git

          # Content-hashed runtime assets are immutable and may still be used
          # by a dormant installed PWA. Carry the deployed set forward; only
          # mutable shell files are replaced by the new release.
          git fetch 5apps +refs/heads/master:refs/remotes/5apps/master
          node scripts/retain-deployed-web-assets.mjs 5apps/master
          node scripts/create-deployed-entry-shims.mjs 5apps/master
          node scripts/check-web-deploy.mjs

          # Create a throwaway branch for the deploy commit so master stays clean.
          git checkout -b deploy/v${VERSION}
          git add packages/web/dist -f
          git commit -m "deploy v${VERSION} [skip ci]"

          SPLIT_SHA=$(git subtree split --prefix=packages/web/dist)
          # 5apps.com has been seen dropping the SSH session mid-push, so the
          # push is retried. The build above carried forward assets from the
          # 5apps/master we fetched, so that fetched SHA is the only remote
          # state this deploy may replace: a lease on it means neither the
          # first attempt nor a retry can clobber a deploy that landed in
          # between. A retry that finds the ref already at SPLIT_SHA means an
          # earlier attempt actually got through and is treated as success.
          EXPECTED_SHA=$(git rev-parse refs/remotes/5apps/master)
          for attempt in {1..5}; do
            if git push 5apps "$SPLIT_SHA":refs/heads/master \
                --force-with-lease=refs/heads/master:"$EXPECTED_SHA"; then
              break
            fi
            REMOTE_SHA=$(git ls-remote 5apps refs/heads/master 2>/dev/null | cut -f1 || true)
            if [ "$REMOTE_SHA" = "$SPLIT_SHA" ]; then
              echo "5apps/master is already at $SPLIT_SHA from an earlier attempt."
              break
            fi
            if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::5apps/master moved to $REMOTE_SHA (expected $EXPECTED_SHA) while this deploy was running. Refusing to overwrite it; re-dispatch to deploy on top of it."
              exit 1
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Push to 5apps failed after 5 attempts."
              exit 1
            fi
            echo "Push to 5apps failed (attempt $attempt/5), retrying..."
            sleep $((attempt * 10))
          done

          # Return to master; the deploy branch is local-only and discarded.
          git checkout master

      - name: Create GitHub Release
        # Last step of the release, and the one most exposed to a transient
        # GitHub API blip (a 503 here once left a tagged, deployed version with
        # no release entry). Retry the call, and treat an already-created
        # release as done so a re-run of the job doesn't fail on it.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists — nothing to create."
            exit 0
          fi

          for attempt in 1 2 3; do
            if gh release create "v${VERSION}" --generate-notes; then
              exit 0
            fi
            # A create can fail *after* the release was written (the blip that
            # prompted this can land on either side of the write), and a
            # concurrent run may have created it meanwhile. Either way the work
            # is done — check before burning another attempt or failing.
            if gh release view "v${VERSION}" >/dev/null 2>&1; then
              echo "::notice::Release v${VERSION} exists despite the failed create — treating as done."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::gh release create failed (attempt ${attempt}/3); retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
            fi
          done

          echo "::error::Could not create the GitHub Release for v${VERSION}. The tag is pushed and the deploy is live — create the release with: gh release create v${VERSION} --generate-notes"
          exit 1

      - name: Attach extension binaries and reviewer sources
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "v${VERSION}" dist/submissions/*/* --clobber

  # Store publishing. Each job runs only when release-bump.mjs bumped its
  # package (stores reject a re-used version), uses the exact artifacts the
  # release job verified, and skips with a notice when its secrets are unset.
  # Re-running after a partial publish is safe: a version the store already
  # has counts as success.
  publish-chrome:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.extension_bumped == 'true'
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check Chrome Web Store secrets
        id: secrets
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ] || [ -z "$CHROME_PUBLISHER_ID" ] || [ -z "$CHROME_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Chrome Web Store secrets are not set; skipping Chrome publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: extension-submissions-${{ needs.release.outputs.version }}
          path: dist/submissions

      - name: Upload and publish to Chrome Web Store
        if: steps.secrets.outputs.configured == 'true'
        run: node scripts/publish/chrome.mjs "dist/submissions/chromium/inbox-rs-chromium-${VERSION}.zip" "$VERSION"

  publish-firefox:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.extension_bumped == 'true'
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # web-ext reads these instead of --api-key/--api-secret on the command line.
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check AMO secrets
        id: secrets
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::AMO secrets are not set; skipping Firefox publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: extension-submissions-${{ needs.release.outputs.version }}
          path: dist/submissions

      - name: Submit to AMO (listed)
        # web-ext signs a directory, so unpack the verified XPI. The source ZIP
        # goes along for AMO's reviewers. --approval-timeout 0 returns once the
        # version is submitted rather than waiting on a human review.
        if: steps.secrets.outputs.configured == 'true'
        run: |
          # The locked scripts workspace, not a registry resolve: web-ext runs
          # with the AMO credentials in its environment.
          npm ci --workspace=scripts --include-workspace-root=false --ignore-scripts
          # npm exec --workspace runs from scripts/, so the paths below are absolute.

          SOURCE_DIR="$RUNNER_TEMP/firefox-${VERSION}"
          mkdir -p "$SOURCE_DIR"
          unzip -q "dist/submissions/firefox/inbox-rs-firefox-${VERSION}.xpi" -d "$SOURCE_DIR"

          set +e
          npm exec --no --workspace=scripts -- web-ext sign \
            --channel=listed \
            --source-dir "$SOURCE_DIR" \
            --artifacts-dir "$RUNNER_TEMP/web-ext-artifacts" \
            --upload-source-code "$GITHUB_WORKSPACE/dist/submissions/firefox/inbox-rs-firefox-${VERSION}-source.zip" \
            --approval-timeout 0 \
            2>&1 | tee "$RUNNER_TEMP/web-ext-sign.log"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if grep -qi "already exists" "$RUNNER_TEMP/web-ext-sign.log"; then
              echo "::notice::AMO already has Firefox ${VERSION}; nothing to do."
              exit 0
            fi
            exit "$STATUS"
          fi

  publish-thunderbird:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.thunderbird_bumped == 'true'
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      ATN_JWT_ISSUER: ${{ secrets.ATN_JWT_ISSUER }}
      ATN_JWT_SECRET: ${{ secrets.ATN_JWT_SECRET }}
    steps:
      - name: Check ATN secrets
        id: secrets
        run: |
          if [ -z "$ATN_JWT_ISSUER" ] || [ -z "$ATN_JWT_SECRET" ]; then
            echo "::notice::ATN secrets are not set; skipping Thunderbird publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: extension-submissions-${{ needs.release.outputs.version }}
          path: dist/submissions

      - name: Upload to addons.thunderbird.net
        if: steps.secrets.outputs.configured == 'true'
        run: >-
          node scripts/publish/atn.mjs
          "dist/submissions/thunderbird/inbox-rs-thunderbird-${VERSION}.xpi"
          "$VERSION"
          "inbox-rs-thunderbird-${VERSION}-source.zip"
