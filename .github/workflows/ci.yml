name: CI

on:
  pull_request:
    branches: [master]
  # Also run on pushes to master so the release workflow can require a
  # green CI commit before publishing (see release.yml gating).
  push:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Biome (lint, format, organize imports)
        run: bun run biome ci

  typecheck:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/rs-module build

      # svelte-check needs the generated plugin-downloads module that the web
      # app imports; it's produced by the dev/build hooks, not by `bun install`.
      # Generate it directly (lightweight — reads package.json versions only).
      - name: Generate plugin metadata
        run: node scripts/gen-plugin-metadata.mjs

      - name: svelte-check (app code)
        run: bun run --cwd packages/web check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Restore transcription asset cache
        uses: actions/cache@v4
        with:
          path: packages/web/public/ml
          key: ${{ runner.os }}-transcription-assets-${{ hashFiles('scripts/vendor-transcription-assets.mjs', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-transcription-assets-

      - run: bun run build

      - name: Precache budget guard
        run: bun run --cwd packages/web check:precache

      # Stash the built web app so the e2e job doesn't pay for a second
      # cold build — Vite + plugin packaging is the slow step here.
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Restore transcription asset cache
        uses: actions/cache@v4
        with:
          path: packages/web/public/ml
          key: ${{ runner.os }}-transcription-assets-${{ hashFiles('scripts/vendor-transcription-assets.mjs', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-transcription-assets-

      # Other workspaces resolve @inbox-rs/rs-module via its `main:
      # dist/index.js`, so the dist must exist before vitest can import it.
      # Build only rs-module (not the full web app) to keep this job fast
      # and parallel with the build job.
      - name: Build rs-module
        run: bun run --cwd packages/rs-module build

      - run: bun run test

  e2e:
    name: End-to-end (PWA)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile


      # Pull the prebuilt dist from the build job — `vite preview` will
      # serve straight out of it.
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - name: Install Playwright browser
        run: bun run test:e2e:install

      # Pre-pull the Armadietto image so Playwright's webServer wait
      # doesn't double-count the container build.
      - name: Build Armadietto image
        run: docker compose build armadietto

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  extension-submissions:
    name: Extension submissions
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run package:plugins
      - run: bun run package:submissions
      - name: Rebuild, audit, compare release artifacts and lint Firefox
        run: bun run check:submissions
      - run: bun run --cwd scripts playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Install extensions and exercise capture in both browsers
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: bun run test:extensions
      - run: bun run screenshots:thunderbird
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-submissions
          path: dist/submissions
          retention-days: 14
          if-no-files-found: error
