name: CI

on:
  pull_request:
    branches: [master]
  # Also run on pushes to master so the release workflow can require a
  # green CI commit before publishing (see release.yml gating).
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - run: npm run build
      - run: npm test

      # Stash the built web app so the e2e job doesn't pay for a second
      # cold build — Vite + plugin packaging is the slow step here.
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: End-to-end (PWA)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - run: npm ci

      # Pull the prebuilt dist from the build job — `vite preview` will
      # serve straight out of it.
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - name: Install Python + Playwright deps
        run: npm run test:e2e:install

      # Pre-pull the Armadietto image so the test harness's wait_for_port
      # timer doesn't double-count the container build.
      - name: Build Armadietto image
        run: docker compose build armadietto

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore
