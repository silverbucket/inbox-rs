name: Publish to Chrome Web Store

# Re-submit the Chromium build of an existing release, without cutting a new
# one. For a store publish that failed (see docs/RELEASING.md). It uploads the
# ZIP attached to that GitHub Release, the same file the release verified.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v2.6.9)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-chrome:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check Chrome Web Store secrets
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ] || [ -z "$CHROME_PUBLISHER_ID" ] || [ -z "$CHROME_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Chrome Web Store secrets are not set."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the Chromium ZIP from the release
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          gh release download "$TAG" --pattern "inbox-rs-chromium-${VERSION}.zip" --dir "$RUNNER_TEMP"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload and publish to Chrome Web Store
        env:
          VERSION: ${{ steps.zip.outputs.version }}
        run: node scripts/publish/chrome.mjs "$RUNNER_TEMP/inbox-rs-chromium-${VERSION}.zip" "$VERSION"
