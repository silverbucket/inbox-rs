[pytest]
# Test discovery
testpaths = desktop mobile
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: chromium only (matches the webapp-testing skill recommendation).
# Mobile tests opt into device emulation via the `mobile_page` fixture, so we
# don't multiply runs across browsers here. Run with `--browser firefox` to
# cross-check Firefox.
addopts =
    -ra
    --strict-markers
    --browser=chromium
    --output=artifacts
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure

markers =
    desktop: tests that target the desktop PWA viewport
    mobile: tests that target a mobile PWA viewport
    pwa: tests that exercise PWA-only behavior (manifest, install, theme)
    rs: tests that require a connected remoteStorage backend
    slow: tests that are slow enough to opt out of the default suite

# Treat warnings as errors so we catch deprecations early. Allow Playwright's
# own DeprecationWarnings through — they fire when third-party code in the
# stack hasn't caught up.
filterwarnings =
    error
    ignore::DeprecationWarning:playwright.*
    ignore::ResourceWarning
